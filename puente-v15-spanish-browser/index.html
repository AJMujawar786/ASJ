<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puente Español</title></head><body><script>(async()=>{let s="";for(let i=0;i<5;i++)s+=await(await fetch(`p${i}.txt`)).text();s=s.replace(/[^A-Za-z0-9+/=]/g,"");while(s.length%4)s+="=";const p=atob(s),b=new Uint8Array(p.length);for(let i=0;i<p.length;i++)b[i]=p.charCodeAt(i);const html=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(html);document.close()})().catch(e=>document.body.innerHTML="<pre style='white-space:pre-wrap;font:16px system-ui;padding:24px'>"+e+"</pre>")</script></body></html>
