<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puente Español</title></head><body><script>(async()=>{let s="";for(let i=0;i<5;i++)s+=await(await fetch(`p${i}.txt`)).text();const p=atob(s),b=new Uint8Array(p.length);for(let i=0;i<p.length;i++)b[i]=p.charCodeAt(i);const html=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(html);document.close()})().catch(e=>document.body.innerHTML="<pre>"+e+"</pre>")</script></body></html>
